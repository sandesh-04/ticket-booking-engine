spring.application.name=TicketBookingEngine

# ---- MySQL ----
# Update username/password to match your local MySQL instance.
# createDatabaseIfNotExist=true means the schema is created automatically on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_booking_db
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- API docs (springdoc) ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs

server.port=8080
